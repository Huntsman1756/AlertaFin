[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertafin"
version = "0.1.0"
description = "Indice auditable de advertencias financieras oficiales (CNMV), con provenance byte-exacta"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/Huntsman1756/AlertaFin"
Repository = "https://github.com/Huntsman1756/AlertaFin"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
alertafin = "alertafin.cli:main"

[tool.setuptools.packages.find]
include = ["alertafin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
