[project]
name = "alertafin"
version = "0.1.0"
description = "AlertaFin G0: indice auditable de advertencias financieras oficiales (CNMV PaffNoAutorizadas)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
alertafin = "alertafin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
