[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alertafin"
version = "0.1.0"
description = "Indice auditable de advertencias financieras oficiales (CNMV), con provenance byte-exacta"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Huntsman1756"}]
keywords = ["cnmv", "dgsfp", "financial-warnings", "regtech", "provenance"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# `idna` se importa directamente en alertafin/domainex.py: es dependencia
# directa, no transitiva de requests.
dependencies = ["requests>=2.31", "idna>=3.7"]

[project.urls]
Homepage = "https://github.com/Huntsman1756/AlertaFin"
Repository = "https://github.com/Huntsman1756/AlertaFin"
Issues = "https://github.com/Huntsman1756/AlertaFin/issues"
Changelog = "https://github.com/Huntsman1756/AlertaFin/blob/main/CHANGELOG.md"
Security = "https://github.com/Huntsman1756/AlertaFin/security/policy"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
alertafin = "alertafin.cli:main"

[tool.setuptools.packages.find]
include = ["alertafin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# ---- Lint (ruff) ----
# Ficheros excluidos: evaluadores/selectores CONGELADOS por fingerprint
# (sha256 registrado en g0/holdout-v2/manifest.json y en el tag
# g1-wi-evaluator-v2). Editarlos invalida la evidencia; no aplicar fixes.
[tool.ruff]
exclude = [
    "scripts/holdout_v2.py",
    "scripts/holdout_sample.py",
    "scripts/g1wi_evaluate.py",
    "alertafin/eval_g1wi.py",
    "alertafin/blind_eval.py",
    "g0",
    "g0-r",
    "g1-wi",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
ignore = [
    # El proyecto mantiene lineas largas deliberadas (regex, cadenas de
    # evidencia); el formato no esta congelado por ancho de linea.
    "E501",
]
