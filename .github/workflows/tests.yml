name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Suite offline: todos los tests corren sobre artefactos
      # congelados del repo; no hay llamadas live a CNMV/DGSFP.
      - name: Install
        run: pip install -e ".[test]"

      - name: Test
        run: pytest
